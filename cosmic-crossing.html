<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Crossing — Physics & Alchemy Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F1F; --panel:#141A33; --panel-2:#1B2247; --ink:#F1F2FA;
    --plasma:#FF3D71; --gold:#FFC93C; --teal:#1FE5C8; --teal-deep:#0E8B7E;
    --violet:#9B5CFF; --green:#39E47E; --red:#FF5C4D; --blue:#52A0FF;
    --shadow:#000010;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Fredoka',sans-serif;
    background:
      radial-gradient(circle at 18% 22%, rgba(155,92,255,.35), transparent 40%),
      radial-gradient(circle at 82% 14%, rgba(31,229,200,.28), transparent 42%),
      radial-gradient(circle at 50% 90%, rgba(255,61,113,.25), transparent 45%),
      var(--bg);
    color:var(--ink);min-height:100dvh;
    display:flex;align-items:center;justify-content:center;padding:18px;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  /* starfield */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 80px 120px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 150px 60px, #fff, transparent),
      radial-gradient(1px 1px at 240px 200px, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 320px 100px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 400px 250px, rgba(255,201,60,.8), transparent),
      radial-gradient(1px 1px at 480px 40px, #fff, transparent),
      radial-gradient(1px 1px at 560px 180px, rgba(155,92,255,.9), transparent),
      radial-gradient(1px 1px at 100px 280px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 360px 320px, rgba(31,229,200,.8), transparent);
    background-size:600px 400px;opacity:.6;animation:drift 90s linear infinite;
  }
  @keyframes drift{from{transform:translate(0,0);}to{transform:translate(-600px,-400px);}}

  .stage{
    width:100%;max-width:600px;background:linear-gradient(180deg,var(--panel) 0%, var(--panel-2) 100%);
    border:2px solid rgba(155,92,255,.45);border-radius:28px;
    box-shadow:0 0 0 1px rgba(31,229,200,.15) inset, 0 20px 60px rgba(0,0,0,.5), 0 0 40px rgba(155,92,255,.15);
    padding:24px 22px 26px;position:relative;overflow:hidden;
  }
  .mono{font-family:'DM Mono',monospace;}
  h1{font-size:2.2rem;line-height:1.05;font-weight:700;letter-spacing:-.5px;
     background:linear-gradient(90deg,var(--teal) 0%, var(--violet) 60%, var(--plasma) 100%);
     -webkit-background-clip:text;background-clip:text;color:transparent;}
  h1 .accent{color:var(--gold);-webkit-text-fill-color:var(--gold);}
  .tag{font-size:1rem;color:#a8aecd;margin-top:8px;font-weight:500;}

  .screen{display:none;animation:pop .32s ease;}
  .screen.on{display:block;}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}

  /* top bar with back */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .back{
    cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.95rem;
    background:rgba(255,255,255,.05);border:2px solid rgba(155,92,255,.4);border-radius:12px;
    padding:7px 13px;color:var(--ink);flex:none;
    transition:transform .08s, background .12s, border-color .12s;
  }
  .back:hover{background:rgba(155,92,255,.15);border-color:var(--violet);}
  .back:active{transform:scale(.96);}
  .crumb{font-weight:600;font-size:1.05rem;color:#a8aecd;}

  /* ---------- topics ---------- */
  .topics{display:grid;gap:12px;margin-top:20px;}
  .topic{
    text-align:left;cursor:pointer;font-family:'Fredoka',sans-serif;
    background:rgba(255,255,255,.04);border:2px solid rgba(155,92,255,.3);border-radius:18px;
    padding:15px 17px;color:var(--ink);
    transition:transform .1s, border-color .12s, background .12s, box-shadow .12s;
    display:flex;align-items:center;gap:14px;
  }
  .topic:hover{transform:translateY(-2px);border-color:var(--teal);background:rgba(31,229,200,.06);
    box-shadow:0 6px 20px rgba(31,229,200,.15);}
  .topic:active{transform:translateY(0);}
  .topic .ic{width:50px;height:50px;border-radius:14px;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:1.6rem;
    border:2px solid rgba(255,255,255,.1);background:rgba(0,0,0,.25);}
  .topic .tt{font-weight:600;font-size:1.16rem;}
  .topic .td{font-size:.88rem;color:#a8aecd;font-weight:500;margin-top:2px;}

  /* ---------- settings ---------- */
  .setblock{margin-top:18px;}
  .setlabel{font-weight:600;font-size:1.02rem;margin-bottom:9px;color:#cfd3eb;}
  .opts{display:flex;gap:9px;flex-wrap:wrap;}
  .opt{
    cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:600;font-size:1rem;
    background:rgba(255,255,255,.04);border:2px solid rgba(155,92,255,.35);border-radius:13px;
    padding:9px 15px;color:var(--ink);
    transition:transform .08s, background .12s, border-color .12s;
  }
  .opt:hover{border-color:var(--teal);background:rgba(31,229,200,.08);}
  .opt:active{transform:scale(.96);}
  .opt.sel{background:linear-gradient(135deg,var(--violet),var(--plasma));border-color:var(--gold);color:#fff;}
  .opt .sub{display:block;font-size:.76rem;font-weight:500;opacity:.85;margin-top:1px;}
  .startbtn{
    display:block;width:100%;margin-top:26px;cursor:pointer;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.3rem;
    background:linear-gradient(135deg,var(--plasma) 0%, var(--violet) 100%);
    color:#fff;border:2px solid var(--gold);
    border-radius:16px;padding:15px;
    box-shadow:0 0 30px rgba(255,61,113,.4), 0 8px 20px rgba(0,0,0,.4);
    transition:transform .08s, box-shadow .12s;
    text-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  .startbtn:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(255,61,113,.6), 0 12px 28px rgba(0,0,0,.4);}
  .startbtn:active{transform:translateY(0);}

  /* ---------- play ---------- */
  .hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;}
  .chip{font-family:'DM Mono',monospace;font-weight:500;border:2px solid rgba(155,92,255,.4);
    border-radius:12px;padding:6px 11px;background:rgba(0,0,0,.25);color:var(--ink);font-size:.92rem;}
  .chip.time{background:linear-gradient(135deg,var(--teal-deep),var(--teal));color:#001a18;border-color:var(--teal);}
  .chip.score{background:linear-gradient(135deg,var(--plasma),var(--gold));color:#1a0610;border-color:var(--gold);}
  .progress{height:13px;border:2px solid rgba(155,92,255,.4);border-radius:10px;background:rgba(0,0,0,.3);overflow:hidden;margin-bottom:18px;}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--teal),var(--violet),var(--plasma));width:0%;transition:width .3s ease;
    box-shadow:0 0 12px rgba(255,61,113,.5);}

  .scenario{
    background:rgba(0,0,0,.28);border:2px solid rgba(31,229,200,.3);border-radius:14px;
    padding:12px 14px;margin-bottom:14px;font-size:.98rem;line-height:1.4;color:#e0e3f5;
    display:none;
  }
  .scenario.on{display:block;}
  .scenario .topictag{display:inline-block;font-family:'DM Mono',monospace;font-size:.78rem;
    background:rgba(31,229,200,.18);color:var(--teal);padding:2px 8px;border-radius:8px;margin-bottom:6px;}

  .q{text-align:center;font-family:'DM Mono',monospace;font-weight:500;
     font-size:clamp(1.9rem,8.5vw,2.9rem);margin:6px 0 22px;letter-spacing:1px;color:var(--ink);}
  .q .op{color:var(--plasma);} .q .opd{color:var(--teal);} .q .qmark{color:var(--gold);}
  .q .unit{color:#a8aecd;font-size:.65em;margin-left:6px;}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.75em;}
  .frac .den{border-top:3px solid currentColor;padding-top:2px;}

  .answers{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .ans{font-family:'DM Mono',monospace;font-weight:500;font-size:1.4rem;cursor:pointer;
    background:rgba(255,255,255,.04);border:2px solid rgba(155,92,255,.4);border-radius:15px;padding:15px 8px;color:var(--ink);
    transition:transform .08s, border-color .12s, background .12s, box-shadow .12s;}
  .ans:hover:not(:disabled){transform:translateY(-2px);border-color:var(--teal);background:rgba(31,229,200,.08);
    box-shadow:0 6px 18px rgba(31,229,200,.18);}
  .ans:active:not(:disabled){transform:translateY(0);}
  .ans.correct{background:linear-gradient(135deg,var(--green),var(--teal));color:#001a18;border-color:var(--green);
    box-shadow:0 0 24px rgba(57,228,126,.5);}
  .ans.wrong{background:linear-gradient(135deg,var(--red),var(--plasma));color:#fff;border-color:var(--red);}
  .ans:disabled{cursor:default;}

  .typewrap{display:flex;flex-direction:column;gap:12px;align-items:center;}
  .typein{font-family:'DM Mono',monospace;font-size:1.9rem;text-align:center;width:100%;max-width:280px;
    border:2px solid rgba(155,92,255,.5);border-radius:15px;padding:12px;background:rgba(0,0,0,.3);
    color:var(--ink);}
  .typein:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(31,229,200,.15);}
  .typein.correct{background:linear-gradient(135deg,var(--green),var(--teal));color:#001a18;border-color:var(--green);}
  .typein.wrong{background:linear-gradient(135deg,var(--red),var(--plasma));color:#fff;border-color:var(--red);}
  .submitbtn{cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.1rem;
    background:linear-gradient(135deg,var(--violet),var(--plasma));color:#fff;border:2px solid var(--gold);border-radius:14px;
    padding:11px 28px;transition:transform .08s, box-shadow .12s;
    box-shadow:0 0 20px rgba(155,92,255,.4);}
  .submitbtn:hover{transform:translateY(-1px);box-shadow:0 0 28px rgba(155,92,255,.55);}
  .submitbtn:active{transform:translateY(1px);}

  /* ---------- explainer ---------- */
  .explain{margin-top:20px;display:none;}
  .explain.on{display:block;animation:pop .3s ease;}
  .verdict{font-weight:600;font-size:1.2rem;text-align:center;margin-bottom:12px;}
  .verdict.ok{color:var(--green);text-shadow:0 0 12px rgba(57,228,126,.4);}
  .verdict.no{color:var(--red);}
  .slidebox{background:rgba(0,0,0,.32);border:2px solid rgba(255,201,60,.35);border-radius:16px;padding:16px 14px;
    box-shadow:inset 0 0 24px rgba(255,201,60,.08);}
  .numline{font-family:'DM Mono',monospace;font-size:clamp(1.5rem,7vw,2.2rem);text-align:center;letter-spacing:2px;
    display:flex;justify-content:center;align-items:flex-end;flex-wrap:wrap;}
  .digit{display:inline-block;padding:0 1px;}
  .point{display:inline-block;color:var(--plasma);font-weight:700;transform:translateY(2px);}
  .point.move{animation:hop .9s ease 1;}
  @keyframes hop{0%{transform:translateY(2px) scale(1);color:var(--plasma);}40%{transform:translateY(-18px) scale(1.6);color:var(--gold);}100%{transform:translateY(2px) scale(1);color:var(--plasma);}}
  .moveword{text-align:center;font-weight:500;font-size:1rem;color:#cfd3eb;margin:10px 0;}
  .moveword .r{color:var(--plasma);font-weight:700;} .moveword .l{color:var(--teal);font-weight:700;}
  .why{text-align:center;font-size:1rem;margin-top:12px;color:var(--ink);font-weight:500;}
  .why .fact{display:block;margin-top:8px;font-size:.92rem;color:#a8aecd;font-style:italic;}
  .nlwrap{overflow-x:auto;padding-bottom:4px;}
  .nl{display:flex;justify-content:center;gap:4px;min-width:min-content;}
  .nl-cell{font-family:'DM Mono',monospace;font-weight:500;min-width:34px;padding:8px 4px;text-align:center;
    border:2px solid rgba(155,92,255,.4);border-radius:10px;background:rgba(0,0,0,.3);font-size:1rem;color:var(--ink);}
  .nl-cell.zero{font-weight:700;background:linear-gradient(135deg,var(--gold),#FF9F1C);color:#1a0610;border-color:var(--gold);}
  .nl-cell.start{background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;border-color:var(--blue);}
  .nl-cell.end{background:linear-gradient(135deg,var(--green),var(--teal));color:#001a18;border-color:var(--green);}
  .fexp{font-family:'DM Mono',monospace;text-align:center;font-size:1.4rem;color:var(--ink);}

  .next{display:block;width:100%;margin-top:18px;cursor:pointer;font-family:'Fredoka',sans-serif;
    font-weight:600;font-size:1.2rem;background:linear-gradient(135deg,var(--violet),var(--teal-deep));
    color:#fff;border:2px solid var(--teal);
    border-radius:16px;padding:13px;box-shadow:0 0 24px rgba(31,229,200,.25);
    transition:transform .08s, box-shadow .12s;}
  .next:hover{transform:translateY(-1px);box-shadow:0 0 32px rgba(31,229,200,.4);}
  .next:active{transform:translateY(1px);}

  /* ---------- end ---------- */
  .endcard{text-align:center;}
  .bigscore{font-family:'DM Mono',monospace;font-weight:500;font-size:3.6rem;line-height:1;margin:10px 0;
    background:linear-gradient(180deg,var(--gold),var(--plasma));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .bigscore .of{color:#6a708d;font-size:2rem;-webkit-text-fill-color:#6a708d;}
  .stats{display:flex;justify-content:center;gap:12px;margin:16px 0 4px;flex-wrap:wrap;}
  .stat{border:2px solid rgba(155,92,255,.4);border-radius:14px;padding:10px 16px;background:rgba(0,0,0,.25);min-width:104px;}
  .stat .v{font-family:'DM Mono',monospace;font-size:1.4rem;font-weight:500;color:var(--teal);}
  .stat .k{font-size:.83rem;color:#a8aecd;font-weight:500;}
  .msg{font-size:1.12rem;font-weight:600;margin:18px 0 4px;color:#cfd3eb;}
  .endbtns{display:grid;gap:10px;margin-top:16px;}

  .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .conf{position:absolute;width:10px;height:14px;opacity:0;}
  @keyframes fall{0%{opacity:1;transform:translateY(-20px) rotate(0);}100%{opacity:0;transform:translateY(640px) rotate(540deg);}}
</style>
</head>
<body>
<div class="stage">
  <div class="confetti" id="confetti"></div>

  <!-- TOPICS -->
  <section class="screen on" id="topics">
    <h1>Cosmic <span class="accent">Crossing</span></h1>
    <p class="tag">Math at the edge of physics, chemistry & alchemy. Pick a domain.</p>
    <div class="topics" id="topicList"></div>
  </section>

  <!-- SETTINGS -->
  <section class="screen" id="settings">
    <div class="topbar">
      <button class="back" data-go="topics">← Topics</button>
      <span class="crumb" id="setCrumb"></span>
    </div>

    <div class="setblock">
      <div class="setlabel">Difficulty</div>
      <div class="opts" id="optDiff"></div>
    </div>
    <div class="setblock">
      <div class="setlabel">How many questions</div>
      <div class="opts" id="optCount"></div>
    </div>
    <div class="setblock">
      <div class="setlabel">Mode</div>
      <div class="opts" id="optMode"></div>
    </div>
    <div class="setblock">
      <div class="setlabel">How you answer</div>
      <div class="opts" id="optMethod"></div>
    </div>
    <div class="setblock">
      <div class="setlabel">Show feedback after each answer</div>
      <div class="opts" id="optFb"></div>
    </div>

    <button class="startbtn" id="startBtn">Ignite →</button>
  </section>

  <!-- PLAY -->
  <section class="screen" id="play">
    <div class="hud">
      <button class="back" id="exitBtn">← Exit</button>
      <span class="chip" id="qcount">1 / 10</span>
      <span class="chip time" id="timer">0.0s</span>
      <span class="chip score" id="score">★ 0</span>
    </div>
    <div class="progress"><div id="bar"></div></div>

    <div class="scenario" id="scenario"></div>
    <div class="q mono" id="question"></div>

    <div class="answers" id="answers"></div>

    <div class="typewrap" id="typewrap" style="display:none;">
      <input class="typein mono" id="typein" inputmode="decimal" autocomplete="off" placeholder="?">
      <button class="submitbtn" id="submitBtn">Check</button>
    </div>

    <div class="explain" id="explain">
      <div class="verdict" id="verdict"></div>
      <div id="explainBody"></div>
      <button class="next" id="nextBtn">Next →</button>
    </div>
  </section>

  <!-- END -->
  <section class="screen" id="end">
    <div class="topbar"><button class="back" data-go="topics">← Topics</button></div>
    <div class="endcard">
      <h1 id="endTitle">Done!</h1>
      <div class="bigscore"><span id="finalScore">0</span><span class="of" id="finalOf"> / 10</span></div>
      <div class="stats">
        <div class="stat"><div class="v" id="finalTime">0s</div><div class="k">total time</div></div>
        <div class="stat"><div class="v" id="finalAcc">0%</div><div class="k">accuracy</div></div>
      </div>
      <p class="msg" id="endMsg"></p>
      <div class="endbtns">
        <button class="next" id="againBtn" style="background:linear-gradient(135deg,var(--plasma),var(--gold));border-color:var(--gold);">Play again</button>
        <button class="next" id="changeBtn">Change settings</button>
      </div>
    </div>
  </section>
</div>

<script>
/* ===== math helpers ===== */
function shiftPoint(numStr, places){
  let s=String(numStr), neg=s.startsWith('-'); if(neg)s=s.slice(1);
  let [intPart, fracPart='']=s.split('.');
  let digits=(intPart+fracPart).replace(/^0+(?=\d)/,'');
  let pfr=fracPart.length-places;
  if(pfr<=0){digits=digits+'0'.repeat(-pfr);fracPart='';intPart=digits;}
  else if(pfr>=digits.length){digits='0'.repeat(pfr-digits.length+1)+digits;intPart=digits.slice(0,digits.length-pfr);fracPart=digits.slice(digits.length-pfr);}
  else{intPart=digits.slice(0,digits.length-pfr);fracPart=digits.slice(digits.length-pfr);}
  intPart=intPart.replace(/^0+(?=\d)/,''); if(intPart==='')intPart='0';
  fracPart=fracPart.replace(/0+$/,'');
  let out=fracPart?intPart+'.'+fracPart:intPart;
  if(neg&&out!=='0')out='-'+out; return out;
}
function normalize(s){
  s=String(s).trim().replace(/\s+/g,'').replace(/^\+/,'');
  if(s==='')return null;
  if(!/^-?\d*\.?\d*$/.test(s)||s==='-'||s==='.')return 'INVALID';
  let neg=s.startsWith('-'); if(neg)s=s.slice(1);
  let [i='',f='']=s.split('.');
  i=i.replace(/^0+(?=\d)/,''); if(i==='')i='0'; f=f.replace(/0+$/,'');
  let out=f?i+'.'+f:i; if(neg&&out!=='0')out='-'+out; return out;
}
function fracToDec(n,d){let s=(n/d).toFixed(8);return s.replace(/0+$/,'').replace(/\.$/,'');}
const intStr = n => String(n===0?0:n);
const rnd = a => a[Math.floor(Math.random()*a.length)];

/* ===== Real-world scenarios — same math, wrapped in physics/chemistry/alchemy ===== */
/* Each scenario:
   pick(a, op): returns {tag, intro(a), outro(ans), unit} — uses the value a + the operation op
*/
const SCENARIOS = {
  scale:[ // for shift / powers — multiplying or dividing by 10/100/1000
    {tag:'Black Holes', unit:'km',
      intro:(a,op)=>`The Schwarzschild radius of a small black hole is <b>${a} km</b>. A black hole <b>${op}</b> as massive has a radius...`,
      fact:`A black hole's event horizon scales linearly with mass — 10× the mass means 10× the radius.`},
    {tag:'Neutron Stars', unit:'km',
      intro:(a,op)=>`A neutron star is about <b>${a} km</b> across. In a 3D simulation scaled <b>${op}</b>, its diameter becomes...`,
      fact:`Real neutron stars are ~20 km across yet pack 1.4 Sun-masses — denser than an atomic nucleus.`},
    {tag:'Atomic Radius', unit:'Å',
      intro:(a,op)=>`A hydrogen atom has a radius of <b>${a} Å</b>. Stretched <b>${op}</b> in a Rydberg state, the radius is...`,
      fact:`1 Ångström = 10⁻¹⁰ m. Excited "Rydberg atoms" can balloon thousands of times larger.`},
    {tag:'Light & Distance', unit:'ly',
      intro:(a,op)=>`A star sits <b>${a} ly</b> away. A galaxy <b>${op}</b> as far would be at...`,
      fact:`The Milky Way is ~100,000 light-years across; Andromeda is 2.5 million ly away.`},
    {tag:'Alchemy / Concentration', unit:'mol/L',
      intro:(a,op)=>`A reagent sits at <b>${a} mol/L</b>. After a <b>${op}</b> dilution step the concentration is...`,
      fact:`Each ×10 dilution drops concentration by one order of magnitude — homeopathy abuses this.`},
    {tag:'Half-life', unit:'s',
      intro:(a,op)=>`An isotope has a half-life of <b>${a} s</b>. A nucleus <b>${op}</b> more stable lasts...`,
      fact:`Half-lives span 30 orders of magnitude — from yoctoseconds to billions of years.`},
    {tag:'Wavelengths', unit:'nm',
      intro:(a,op)=>`A laser emits at <b>${a} nm</b>. Shifted <b>${op}</b>, the new wavelength is...`,
      fact:`Visible light: 380–750 nm. Radio: meters. Gamma: picometers. All the same EM spectrum.`}
  ],
  cross:[ // for negatives — values crossing zero
    {tag:'Cryogenics', unit:'°C',
      intro:(x,op,y)=>`Liquid helium sits at <b>${x}°C</b>. Heat it by <b>${op}${formatY(y,op)} °C</b>. New temperature?`,
      fact:`Absolute zero is −273.15°C. Below ~−270°C, helium becomes a superfluid that climbs walls.`},
    {tag:'Voltage', unit:'V',
      intro:(x,op,y)=>`A capacitor plate is at <b>${x} V</b>. Apply a swing of <b>${op}${formatY(y,op)} V</b>. Final potential?`,
      fact:`Crossing zero volts changes the direction current wants to flow — that's how alternators work.`},
    {tag:'Atmospheric Pressure', unit:'kPa (Δ from sea level)',
      intro:(x,op,y)=>`Pressure deviation reads <b>${x} kPa</b>. A storm front brings <b>${op}${formatY(y,op)} kPa</b>. New reading?`,
      fact:`Negative = below sea-level baseline. Hurricane eyes can drop pressure 100+ kPa below normal.`},
    {tag:'Electron Energy Levels', unit:'eV',
      intro:(x,op,y)=>`A bound electron sits at <b>${x} eV</b> (negative = bound). Absorb <b>${op}${formatY(y,op)} eV</b>. New level?`,
      fact:`Hydrogen's ground state is −13.6 eV. Reach 0 eV and the electron escapes — ionization.`},
    {tag:'Antimatter Charge', unit:'e',
      intro:(x,op,y)=>`A particle carries <b>${x} e</b> of charge. It captures a partner of <b>${op}${formatY(y,op)} e</b>. Net charge?`,
      fact:`Antiparticles have opposite charge — annihilation collapses charge to zero, releasing γ-rays.`},
    {tag:'Heat of Reaction', unit:'kJ/mol',
      intro:(x,op,y)=>`A reaction's ΔH starts at <b>${x} kJ/mol</b>. A catalyst shifts it by <b>${op}${formatY(y,op)} kJ/mol</b>. New ΔH?`,
      fact:`Negative ΔH = exothermic (releases heat). Crossing zero flips the reaction's spontaneity story.`}
  ],
  ratio:[ // for fractions → decimals — abundance / composition
    {tag:'Universe Composition',
      intro:(n,d)=>`Hydrogen makes up <b>${n}/${d}</b> of the ordinary mass in a star. As a decimal mass-fraction?`,
      fact:`Stars are ~75% H, ~24% He by mass — the rest is everything else.`},
    {tag:'Isotopic Abundance',
      intro:(n,d)=>`A sample of an element is <b>${n}/${d}</b> a single isotope. The decimal abundance?`,
      fact:`Carbon is 98.9% ¹²C, 1.1% ¹³C. Mass spectrometry can measure parts-per-million abundances.`},
    {tag:'Alloy / Alchemy',
      intro:(n,d)=>`A gold-copper alloy is <b>${n}/${d}</b> gold by mass. Express as a decimal:`,
      fact:`24-karat gold = 1.000 pure. 18-karat = 18/24 = 0.75. Karat is just a fraction in disguise.`},
    {tag:'Molarity',
      intro:(n,d)=>`A solution contains <b>${n}/${d}</b> of a mole per liter. As a decimal mol/L?`,
      fact:`Concentration in decimal form is easier to plug into the rate equation k[A][B].`},
    {tag:'Decay Survival',
      intro:(n,d)=>`After several half-lives, <b>${n}/${d}</b> of the original nuclei remain. As a decimal:`,
      fact:`Each half-life halves what's left: 1, 1/2, 1/4, 1/8, ... a geometric series with ratio 1/2.`},
    {tag:'Eclipse Coverage',
      intro:(n,d)=>`The Moon covers <b>${n}/${d}</b> of the Sun's disk. As a decimal fraction:`,
      fact:`A total eclipse needs 1.000 coverage. At 0.999 you still need eye protection.`}
  ]
};
function formatY(y, op){
  // y is positive integer; op is '+' or '−'. For negatives display "(−y)" style if y is intentionally negative
  return ` ${y}`;
}

/* Pick scenario per category, keeping it stable for the explain step */
function pickScenario(category){
  const list = SCENARIOS[category];
  return list[Math.floor(Math.random()*list.length)];
}

/* ===== topics ===== */
const TOPICS = {
  cosmic:{
    title:'Cosmic Scaling — ×10, ÷10',
    desc:'Slide the decimal across the universe',
    icon:'🌌', accent:'var(--violet)',
    diffs:['Easy','Medium','Hard'],
    make(diff){
      let a, op;
      if(diff==='Easy'){ a=rnd(['3','7','4','8','6','9','5','12','15','11','20']); op='×10'; }
      else if(diff==='Medium'){ a=rnd(['0.5','0.3','0.7','2.4','1.6','0.9','3.5','0.08','4.2','0.06','0.25']); op='×10'; }
      else { const pool=[['0.5','÷10'],['50','÷10'],['-0.5','×10'],['3.2','÷10'],['-12','÷10'],['0.07','×10'],['-4','×10'],['250','÷10'],['1.5','÷10'],['-0.6','×10']]; const p=rnd(pool); a=p[0]; op=p[1]; }
      const places = op==='×10'?1:-1;
      const ans = shiftPoint(a, places);
      const dist = [shiftPoint(a,-places), shiftPoint(a,2*places), a, shiftPoint(a,-2*places)];
      const sc = pickScenario('scale');
      return {promptHTML:`${a} <span class="${op==='×10'?'op':'opd'}">${op}</span> = <span class="qmark">?</span>`,
              scenarioHTML:`<span class="topictag">${sc.tag}</span><div>${sc.intro(a,op)}</div>`,
              scenarioFact:sc.fact,
              answer:ans, distractors:dist, type:'shift',
              exp:{a, op, places, ans, unit:sc.unit||'', tag:sc.tag}};
    }
  },
  powers:{
    title:'Powers of 10',
    desc:'Multiply & divide by 10, 100, 1000 — the language of scale',
    icon:'⚛️', accent:'var(--teal)',
    diffs:['Easy','Medium','Hard'],
    make(diff){
      let a, opnum, sign;
      if(diff==='Easy'){ a=rnd(['3','5','7','12','9','4']); opnum=rnd([10,100]); sign=1; }
      else if(diff==='Medium'){ a=rnd(['2.5','0.4','1.2','0.75','3.6','0.9']); opnum=rnd([10,100]); sign=rnd([1,-1]); }
      else { a=rnd(['2.5','0.04','-1.5','340','0.8','-25','1.25']); opnum=rnd([100,1000]); sign=rnd([1,-1]); }
      const op = (sign>0?'×':'÷') + opnum;
      const k = String(opnum).length-1;
      const places = sign>0 ? k : -k;
      const ans = shiftPoint(a, places);
      const dist=[shiftPoint(a,-places), shiftPoint(a,places+(sign>0?-1:1)), shiftPoint(a,places+(sign>0?1:-1)), a];
      const sc = pickScenario('scale');
      return {promptHTML:`${a} <span class="${sign>0?'op':'opd'}">${op}</span> = <span class="qmark">?</span>`,
              scenarioHTML:`<span class="topictag">${sc.tag}</span><div>${sc.intro(a,op)}</div>`,
              scenarioFact:sc.fact,
              answer:ans, distractors:dist, type:'shift',
              exp:{a, op, places, ans, unit:sc.unit||'', tag:sc.tag}};
    }
  },
  negatives:{
    title:'Crossing Absolute Zero',
    desc:'Add & subtract across the zero line — voltages, temperatures, charges',
    icon:'❄️', accent:'var(--blue)',
    diffs:['Easy','Medium','Hard'],
    make(diff){
      let x,y,sub=false;
      if(diff==='Easy'){ x=rnd([-3,-2,-4,-1,2,3]); y=rnd([2,3,4,5]); sub=Math.random()<0.4; }
      else if(diff==='Medium'){ x=rnd([-8,-6,-7,-5,4,6,7]); y=rnd([3,5,8,9,11,12]); sub=Math.random()<0.5; }
      else { x=rnd([-9,-7,5,6,-4,8]); y=rnd([-6,-9,-3,7,12,-5]); sub=Math.random()<0.5; }
      const res = sub ? x - y : x + y;
      const opShown = sub ? '−' : '+';
      const ystr = y<0 ? `(${y})` : `${y}`;
      const ans = intStr(res);
      const dist=[ intStr(sub? x+y : x-y), intStr(-res), intStr(res+ (res>=0?-1:1)), intStr(res + (Math.random()<.5?2:-2)) ];
      const sc = pickScenario('cross');
      return {promptHTML:`${x} <span class="op">${opShown}</span> ${ystr} = <span class="qmark">?</span>`,
              scenarioHTML:`<span class="topictag">${sc.tag}</span><div>${sc.intro(x,opShown,y<0?`(${y})`:y)}</div>`,
              scenarioFact:sc.fact,
              answer:ans, distractors:dist, type:'neg',
              exp:{start:x, delta: sub? -y : y, end:res, unit:sc.unit||'', tag:sc.tag}};
    }
  },
  fractions:{
    title:'Alchemy Ratios → Decimals',
    desc:'Mole fractions, abundances, karats — turn ratios into decimals',
    icon:'🧪', accent:'var(--gold)',
    diffs:['Easy','Medium','Hard'],
    make(diff){
      let n,d;
      if(diff==='Easy'){ const p=rnd([[1,2],[1,4],[3,4],[1,10],[3,10],[1,5],[2,5]]); n=p[0];d=p[1]; }
      else if(diff==='Medium'){ const p=rnd([[1,8],[3,8],[5,8],[7,8],[7,10],[4,5],[3,4]]); n=p[0];d=p[1]; }
      else { const p=rnd([[3,16],[1,16],[5,16],[9,20],[7,20],[11,20],[5,8]]); n=p[0];d=p[1]; }
      const ans=fracToDec(n,d);
      const dist=[ shiftPoint(ans,1), shiftPoint(ans,-1), normalize('0.'+n+d), fracToDec(d,n) ];
      const sc = pickScenario('ratio');
      return {promptHTML:`<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span> = <span class="qmark">?</span>`,
              scenarioHTML:`<span class="topictag">${sc.tag}</span><div>${sc.intro(n,d)}</div>`,
              scenarioFact:sc.fact,
              answer:ans, distractors:dist, type:'frac',
              exp:{n, d, ans, tag:sc.tag}};
    }
  }
};

/* ===== settings model ===== */
const SET = { topic:null, diff:'Easy', count:10, method:'choice', feedback:true, mode:'pure' };
const COUNTS=[5,10,15,20];
const MODES=[['pure','Pure math','just the numbers'],['real','Real world','physics & alchemy']];
const METHODS=[['choice','Multiple choice','easier'],['type','Type the answer','harder']];
const FBS=[[true,'On','see why'],[false,'Off','speed run']];

/* ===== runtime ===== */
let queue, idx, score, attempts, startTime, timerInt, locked;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}

function buildTopics(){
  const list=$('topicList'); list.innerHTML='';
  Object.entries(TOPICS).forEach(([key,t])=>{
    const b=document.createElement('button'); b.className='topic';
    b.innerHTML=`<span class="ic" style="background:linear-gradient(135deg,${t.accent},rgba(0,0,0,.3))">${t.icon}</span>
      <span><span class="tt">${t.title}</span><div class="td">${t.desc}</div></span>`;
    b.addEventListener('click',()=>openSettings(key));
    list.appendChild(b);
  });
}

function openSettings(key){
  SET.topic=key;
  const t=TOPICS[key];
  $('setCrumb').textContent=t.title;
  if(!t.diffs.includes(SET.diff)) SET.diff=t.diffs[0];
  renderOpts('optDiff', t.diffs.map(d=>[d,d]), 'diff');
  renderOpts('optCount', COUNTS.map(c=>[c, String(c)]), 'count');
  renderOpts('optMode', MODES.map(m=>[m[0], m[1], m[2]]), 'mode');
  renderOpts('optMethod', METHODS.map(m=>[m[0], m[1], m[2]]), 'method');
  renderOpts('optFb', FBS.map(f=>[f[0], f[1], f[2]]), 'feedback');
  show('settings');
}
function renderOpts(containerId, items, field){
  const c=$(containerId); c.innerHTML='';
  items.forEach(it=>{
    const [val,label,sub]=it;
    const b=document.createElement('button'); b.className='opt'+(SET[field]===val?' sel':'');
    b.innerHTML = sub ? `${label}<span class="sub">${sub}</span>` : label;
    b.addEventListener('click',()=>{ SET[field]=val; renderOpts(containerId, items, field); });
    c.appendChild(b);
  });
}

$('startBtn').addEventListener('click', startGame);
$('exitBtn').addEventListener('click', ()=>{ clearInterval(timerInt); show('settings'); });
$('nextBtn').addEventListener('click', nextQuestion);
$('submitBtn').addEventListener('click', submitTyped);
$('againBtn').addEventListener('click', startGame);
$('changeBtn').addEventListener('click', ()=> show('settings'));
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{clearInterval(timerInt);show(b.dataset.go);}));
$('typein').addEventListener('keydown', e=>{ if(e.key==='Enter') submitTyped(); });

function startGame(){
  const t=TOPICS[SET.topic];
  queue=[]; for(let i=0;i<SET.count;i++) queue.push(t.make(SET.diff));
  idx=0; score=0; attempts=0; locked=false;
  startTime=Date.now(); clearInterval(timerInt);
  timerInt=setInterval(()=>{$('timer').textContent=((Date.now()-startTime)/1000).toFixed(1)+'s';},100);
  show('play'); renderQuestion();
}

function renderQuestion(){
  locked=false;
  const q=queue[idx];
  $('question').innerHTML=q.promptHTML;
  $('qcount').textContent=`${idx+1} / ${SET.count}`;
  $('score').textContent=`★ ${score}`;
  $('bar').style.width=(idx/SET.count*100)+'%';
  $('explain').classList.remove('on');

  const scn=$('scenario');
  if(SET.mode==='real' && q.scenarioHTML){ scn.innerHTML=q.scenarioHTML; scn.classList.add('on'); }
  else { scn.classList.remove('on'); scn.innerHTML=''; }

  if(SET.method==='choice'){
    $('answers').style.display='grid';
    $('typewrap').style.display='none';
    const set=new Set([q.answer]); const opts=[q.answer];
    q.distractors.forEach(d=>{ if(d!=null && !set.has(d) && opts.length<4){set.add(d);opts.push(d);} });
    let k=1, guard=0; while(opts.length<4 && guard++<40){ const f=shiftPoint(q.answer,k); if(!set.has(f)){set.add(f);opts.push(f);} k=k>0?-k:(-k+1); }
    while(opts.length<4){ const f=String(parseFloat(q.answer)+opts.length); if(!set.has(f)){set.add(f);opts.push(f);} }
    opts.sort((a,b)=>parseFloat(a)-parseFloat(b));
    const wrap=$('answers'); wrap.innerHTML='';
    opts.forEach(o=>{
      const btn=document.createElement('button'); btn.className='ans mono'; btn.textContent=o;
      btn.addEventListener('click',()=>resolve(o===q.answer, btn, q));
      wrap.appendChild(btn);
    });
  } else {
    $('answers').style.display='none';
    $('typewrap').style.display='flex';
    const ti=$('typein'); ti.value=''; ti.disabled=false; ti.className='typein mono'; ti.focus();
    $('submitBtn').disabled=false;
  }
}

function submitTyped(){
  if(locked) return;
  const ti=$('typein'); const norm=normalize(ti.value);
  if(norm===null||norm==='INVALID'){ ti.focus(); return; }
  const q=queue[idx];
  const right = norm===q.answer;
  ti.disabled=true; $('submitBtn').disabled=true;
  ti.classList.add(right?'correct':'wrong');
  resolve(right, null, q);
}

function resolve(right, btn, q){
  if(locked) return; locked=true; attempts++;
  if(SET.method==='choice'){
    document.querySelectorAll('.ans').forEach(b=>{ b.disabled=true; if(b.textContent===q.answer) b.classList.add('correct'); });
    if(btn && !right) btn.classList.add('wrong');
  }
  if(right){ score++; $('score').textContent=`★ ${score}`; burst(); }

  if(SET.feedback){ showExplain(q,right); }
  else { setTimeout(nextQuestion, 650); }
}

/* ===== explainers ===== */
function renderNum(str, move){
  let h='';
  for(const ch of str){
    if(ch==='.') h+=`<span class="point${move?' move':''}">.</span>`;
    else if(ch==='-') h+=`<span class="digit">−</span>`;
    else h+=`<span class="digit">${ch}</span>`;
  }
  return h;
}
function numberLine(start,end){
  let lo=Math.min(start,end,0)-1, hi=Math.max(start,end,0)+1;
  if(hi-lo>14){ lo=Math.min(start,end)-1; hi=Math.max(start,end)+1; }
  let cells='';
  for(let n=lo;n<=hi;n++){
    let cls='nl-cell';
    if(n===0)cls+=' zero';
    if(n===start)cls+=' start';
    if(n===end)cls+=' end';
    cells+=`<div class="${cls}">${n}</div>`;
  }
  return `<div class="nlwrap"><div class="nl">${cells}</div></div>`;
}
function showExplain(q,right){
  const v=$('verdict'); v.textContent=right?'Yes! ✨':'Not quite — here\'s the trick:'; v.className='verdict '+(right?'ok':'no');
  const body=$('explainBody'); let html='';
  const showFact = SET.mode==='real' && q.scenarioFact;

  if(q.type==='shift'){
    const e=q.exp, steps=Math.abs(e.places), dir=e.places>0?'right':'left', cls=e.places>0?'r':'l', arr=e.places>0?'→':'←';
    html=`<div class="slidebox">
      <div class="numline">${renderNum(e.a,false)}</div>
      <div class="moveword">${e.op} → slide the point <span class="${cls}">${steps} step${steps>1?'s':''} ${dir} ${arr}</span></div>
      <div class="numline">${renderNum(e.ans,true)}</div>
    </div>
    <div class="why">${e.places>0?'Bigger: each digit climbs a place value.':'Smaller: each digit drops a place value.'}${e.a.startsWith('-')?' The minus sign rides along.':''}${showFact?`<span class="fact">${q.scenarioFact}</span>`:''}</div>`;
  }
  else if(q.type==='neg'){
    const e=q.exp, dir=e.delta>=0?'right':'left', mag=Math.abs(e.delta);
    html=`<div class="slidebox">${numberLine(e.start,e.end)}
      <div class="moveword">Start at <b>${e.start}</b>, hop <span class="${e.delta>=0?'r':'l'}">${mag} ${dir}</span>, land on <b>${e.end}</b></div></div>
      <div class="why">${(e.start<0)!==(e.end<0)?'You cross zero — that\'s the tricky part.':'Same side of zero the whole way.'}${showFact?`<span class="fact">${q.scenarioFact}</span>`:''}</div>`;
  }
  else if(q.type==='frac'){
    const e=q.exp;
    html=`<div class="slidebox">
      <div class="fexp"><span class="frac"><span>${e.n}</span><span class="den">${e.d}</span></span> &nbsp;means&nbsp; ${e.n} <span style="color:var(--teal)">÷</span> ${e.d}</div>
      <div class="moveword">${e.n} ÷ ${e.d} = <b class="mono">${e.ans}</b></div></div>
      <div class="why">A fraction is just a division waiting to happen.${showFact?`<span class="fact">${q.scenarioFact}</span>`:''}</div>`;
  }
  body.innerHTML=html;
  $('explain').classList.add('on');
}

function nextQuestion(){
  idx++;
  if(idx>=SET.count){ endGame(); return; }
  renderQuestion();
}

function endGame(){
  clearInterval(timerInt);
  const total=((Date.now()-startTime)/1000).toFixed(1);
  show('end');
  $('finalScore').textContent=score;
  $('finalOf').textContent=' / '+SET.count;
  $('finalTime').textContent=total+'s';
  $('finalAcc').textContent=Math.round(score/SET.count*100)+'%';
  $('bar').style.width='100%';
  const pct=score/SET.count;
  let title,msg;
  if(pct===1){title='Stellar! 🌟';msg='Flawless. You bend the universe with decimals.';}
  else if(pct>=0.7){title='Great orbit!';msg='Strong run. A couple more cycles and it\'s instinct.';}
  else if(pct>=0.4){title='Warming up';msg='You\'re getting it — try again and watch the feedback.';}
  else {title='Keep transmuting';msg='Switch feedback on, slow down — the pattern is there.';}
  $('endTitle').textContent=title; $('endMsg').textContent=msg;
}

function burst(){
  const c=$('confetti'), colors=['#FF3D71','#FFC93C','#1FE5C8','#9B5CFF','#39E47E','#52A0FF'];
  for(let i=0;i<20;i++){
    const d=document.createElement('div'); d.className='conf';
    d.style.left=(10+Math.random()*80)+'%'; d.style.background=colors[i%colors.length];
    d.style.animation=`fall ${0.8+Math.random()*0.7}s ease ${Math.random()*0.15}s forwards`;
    d.style.borderRadius=Math.random()>0.5?'2px':'50%';
    d.style.boxShadow=`0 0 8px ${colors[i%colors.length]}`;
    c.appendChild(d); setTimeout(()=>d.remove(),1800);
  }
}

buildTopics();
</script>
